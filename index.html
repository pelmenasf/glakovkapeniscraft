<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gladkovka Penis Craft — Season 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--g:#00ff1a;--g2:#7dff8a;box-sizing:border-box}
*{box-sizing:inherit;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--g);font-family:'Unbounded','Arial Black',Impact,sans-serif;overflow:hidden}
canvas#rain{position:fixed;inset:0;opacity:.28;z-index:0}
body::after{content:"";position:fixed;inset:0;z-index:5;pointer-events:none;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);animation:flick 6s infinite}
@keyframes flick{0%,95%,100%{opacity:1}96%{opacity:.6}98%{opacity:.85}}
.view{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:env(safe-area-inset-top,0) 24px env(safe-area-inset-bottom,0);text-align:center;
 opacity:0;visibility:hidden;transform:scale(.96) translateY(20px);filter:blur(8px);
 transition:all .6s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
.view.on{opacity:1;visibility:visible;transform:none;filter:none}
.logo{width:min(380px,60vw);animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 18px var(--g))}
.logo.sm{width:min(380px,34vw)}
@keyframes float{50%{transform:translateY(-14px) rotate(-1.5deg)}}
h1{font-weight:900;font-size:clamp(28px,6.2vw,88px);line-height:1.15;text-transform:uppercase;text-shadow:0 0 22px rgba(0,255,26,.6);margin:10px 0}
h2{font-weight:900;font-size:clamp(30px,5vw,72px);text-transform:uppercase;text-shadow:0 0 18px rgba(0,255,26,.6);margin-bottom:12px}
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;inset:0;overflow:hidden}
.glitch::before{color:#0ff;left:3px;clip-path:inset(0 0 60% 0);animation:gl 3s infinite steps(1)}
.glitch::after{color:#f0f;left:-3px;clip-path:inset(60% 0 0 0);animation:gl 3s infinite steps(1) reverse}
@keyframes gl{0%,90%,100%{transform:none;opacity:0}91%{transform:translate(-4px,2px);opacity:.8}94%{transform:translate(4px,-2px);opacity:.8}97%{transform:translate(-2px,0);opacity:.8}}
nav.menu{display:flex;flex-direction:column;gap:6px;margin-top:22px}
.btn{background:none;border:0;color:var(--g);font:inherit;font-weight:700;font-size:clamp(18px,2.4vw,32px);cursor:pointer;
 position:relative;padding:4px 14px;transition:.25s;text-decoration:none;display:inline-block}
.btn::before{content:"> ";opacity:0;margin-left:-1.2em;transition:.25s}
.btn:hover{color:#000;background:var(--g);transform:scale(1.08) skewX(-6deg);box-shadow:0 0 28px var(--g)}
.btn:hover::before{opacity:1;margin-left:0}
.lang{position:fixed;top:calc(14px + env(safe-area-inset-top,0));right:20px;z-index:10;font-weight:900;font-size:clamp(18px,2.6vw,36px)}
.lang button{background:none;border:0;color:var(--g);font:inherit;cursor:pointer;opacity:.55;transition:.2s}
.lang button:hover,.lang button.act{opacity:1;text-shadow:0 0 14px var(--g)}
.back{position:fixed;top:calc(14px + env(safe-area-inset-top,0));left:20px;z-index:10;display:none;font-size:clamp(16px,2vw,28px)}
.back.show{display:block}
.row{display:flex;align-items:center;justify-content:center;gap:4vw;flex-wrap:wrap;width:100%;max-width:1500px}
.txt{flex:1 1 480px;max-width:1000px}
.txt p{font-weight:700;font-size:clamp(15px,2.2vw,34px);line-height:1.5}
.txt p span{display:block;opacity:0;transform:translateY(20px);animation:up .6s forwards}
@keyframes up{to{opacity:1;transform:none}}
.foot{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0));right:14px;z-index:10;font-weight:700;font-size:clamp(8px,1.1vw,15px);text-align:right;opacity:.85}
.map{width:min(900px,90vw);height:min(46vh,420px);border:2px solid var(--g);margin:18px 0;position:relative;overflow:hidden;
 background:linear-gradient(rgba(0,255,26,.12) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,rgba(0,255,26,.12) 1px,transparent 1px) 0 0/40px 40px;
 box-shadow:0 0 30px rgba(0,255,26,.35),inset 0 0 40px rgba(0,255,26,.15);perspective:600px}
.map i{position:absolute;bottom:0;width:46px;background:var(--g);opacity:.7;animation:grow 3s ease-in-out infinite alternate;box-shadow:0 0 14px var(--g)}
@keyframes grow{from{height:var(--a)}to{height:var(--b)}}
.apply a{color:var(--g);text-decoration:none;border-bottom:3px solid var(--g);transition:.25s}
.apply a:hover{background:var(--g);color:#000;text-shadow:none}
.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{50%{text-shadow:0 0 40px var(--g),0 0 80px var(--g);transform:scale(1.05)}}
@media(max-width:700px){.logo.sm{width:60vw}}
</style>
</head>
